group_id: sdl.harvard
name: geospatial # Will be concatenated with the group_id to an ID
author: Lingbo Liu,Xiaokang Fu,Tobias Koetter
vendor: SDL, Harvard, Cambridge US
description: Geospatial Analytics Extension for KNIME # Human readable bundle name / description
long_description: KNIME nodes for processing, analyzing and visualizing Geospatial data.
version: 2.1.0 # Version of this Python node extension
license_file: LICENSE.TXT # Best practice: put your LICENSE.TXT next to the knime.yml; otherwise you would need to change to path/to/LICENSE.txt
extension_module: src/geospatial_ext # The .py Python module containing the nodes of your extension
pixi_toml_path: pixi.toml # This is necessary for bundling, but not needed during development
feature_dependencies:
  - org.knime.features.geospatial 4.7.0
  - org.knime.features.core 5.13.0 #the file handling nodes use the knext.File API added in 5.13

# The public update.knime.com/analytics-platform/nightly channel is currently only at
# 5.12.0 for org.knime.features.core -- it hasn't cut over to 5.13 yet, so the pin above
# can't resolve there. The internal stable-nightly mirror already has 5.13.0. Overriding
# just the KNIME AP repository here; community-contributions stay on the public nightly.
override_update_sites:
  - id: p2-knime-update-site
    url: https://jenkins.devops.knime.com/p2/knime/analytics-platform/stable-nightly-update-site
  - id: p2-community-trusted-update-site
    url: https://update.knime.com/community-contributions/trusted/nightly
  - id: p2-community-update-site
    url: https://update.knime.com/community-contributions/nightly

